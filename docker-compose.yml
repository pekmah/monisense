services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance_ai"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrator:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-lc", "npm run db:migrate"]
    volumes:
      - .:/app
      - /app/node_modules

  api:
    build: .
    env_file:
      - .env
    depends_on:
      migrator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    command: ["sh", "-lc", "npm run dev"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
